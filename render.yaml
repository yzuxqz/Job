services:
  - type: web
    name: job-tracker
    env: python
    buildCommand: pip install -r requirements.txt && python import_data.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      - name: data
        mountPath: /opt/render/project/src
        sizeGB: 1
